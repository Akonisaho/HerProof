name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: herproof
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: herproof_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U herproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=herproof_test;Username=herproof;Password=ci_only_password
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore HerProof.sln
      - name: Format check
        run: dotnet format HerProof.sln --verify-no-changes --no-restore
      - name: Build (warnings are errors)
        run: dotnet build HerProof.sln --no-restore --configuration Release -warnaserror
      - name: Vulnerable packages gate
        run: |
          dotnet list HerProof.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "Vulnerable NuGet packages found"; exit 1
          fi
      - name: Test with coverage
        run: >
          dotnet test HerProof.sln --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory ./TestResults
          --logger "trx;LogFileName=results.trx"
      - name: EF migrations are up to date
        if: ${{ hashFiles('.config/dotnet-tools.json') != '' }}
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/HerProof.Infrastructure -s src/HerProof.Web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/

  electron:
    name: Electron lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: electron-app/.nvmrc
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  docker-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.web
          failure-threshold: warning

  # Single required check for branch protection
  ci-gate:
    name: CI gate
    if: always()
    needs: [backend, electron, docker-lint]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "backend=${{ needs.backend.result }} electron=${{ needs.electron.result }} docker=${{ needs.docker-lint.result }}"
          test "${{ needs.backend.result }}" = "success" -a "${{ needs.electron.result }}" = "success" -a "${{ needs.docker-lint.result }}" = "success"
